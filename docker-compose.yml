version: '3.8'

services:
  # ETL Scheduler Service
  etl-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etl-scheduler
    environment:
      # Operational Database Connection (source)
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-operational_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      
      # Warehouse Database Connection (destination)
      WH_DB_HOST: ${WH_DB_HOST:-localhost}
      WH_DB_PORT: ${WH_DB_PORT:-5432}
      WH_DB_NAME: ${WH_DB_NAME:-warehouse_db}
      WH_DB_USER: ${WH_DB_USER:-postgres}
      WH_DB_PASSWORD: ${WH_DB_PASSWORD:-postgres}
      
      # Python settings
      PYTHONUNBUFFERED: 1
    
    volumes:
      # Persist ETL logs (outside etl folder)
      - ./etl_logs:/app/etl_logs
      # Persist extracted data
      - ./extracted_data:/app/extracted_data
      # Persist .env file (optional)
      - ./.env:/app/.env:ro
    
    # Restart policy for production
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Only connect to external databases - comment out if using services below
    networks:
      - etl-network
    
    # Dependency on databases (if using services below)
    # depends_on:
    #   operational-db:
    #     condition: service_healthy
    #   warehouse-db:
    #     condition: service_healthy

  # Optional: PostgreSQL for Operational Database
  # Uncomment if you want to run the source database in Docker
  # operational-db:
  #   image: postgres:15-alpine
  #   container_name: operational-db
  #   environment:
  #     POSTGRES_DB: ${OPERATIONAL_DB_NAME:-operational_db}
  #     POSTGRES_USER: ${OPERATIONAL_DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${OPERATIONAL_DB_PASSWORD:-postgres}
  #   volumes:
  #     - operational_db_data:/var/lib/postgresql/data
  #     - ./sample_data.sql:/docker-entrypoint-initdb.d/sample_data.sql:ro
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${OPERATIONAL_DB_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - etl-network

  # Optional: PostgreSQL for Warehouse Database
  # Uncomment if you want to run the warehouse database in Docker
  # warehouse-db:
  #   image: postgres:15-alpine
  #   container_name: warehouse-db
  #   environment:
  #     POSTGRES_DB: ${WAREHOUSE_DB_NAME:-warehouse_db}
  #     POSTGRES_USER: ${WAREHOUSE_DB_USER:-postgres}
  #     POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-postgres}
  #   volumes:
  #     - warehouse_db_data:/var/lib/postgresql/data
  #     - ./warehouse_schema.sql:/docker-entrypoint-initdb.d/warehouse_schema.sql:ro
  #   ports:
  #     - "5433:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER:-postgres}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - etl-network

networks:
  etl-network:
    driver: bridge

volumes:
  operational_db_data:
  warehouse_db_data:
